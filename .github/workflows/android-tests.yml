name: Android Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AGP 8.13.2 and Robolectric 4.16.1 both require JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # google-services.json is gitignored (project-specific Firebase config) - restore it
      # from a repo secret before the build, which needs it present to run at all.
      # Add it via: GitHub repo -> Settings -> Secrets and variables -> Actions ->
      # New repository secret -> name "GOOGLE_SERVICES_JSON" -> paste the full file contents.
      - name: Write google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # GeminiManagerTest.testApiKeyAvailability expects a real key to be present. Add one
      # via: GitHub repo -> Settings -> Secrets and variables -> Actions ->
      # New repository secret -> name "GEMINI_API_KEY".
      - name: Run unit tests (Robolectric/Compose)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew testDebugUnitTest --stacktrace

      # Upload the HTML/XML test reports even when the run fails, so a failure is easy to
      # diagnose from the Actions UI without needing to reproduce it locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
